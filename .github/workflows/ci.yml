name: Python safety checks

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m py_compile junshi_master.py
      - name: Run safety tests
        run: python -m unittest discover -s tests -v
      - name: Build deployment image
        run: docker build -t junshi-telegram-saas:test .
